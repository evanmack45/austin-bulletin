name: Hard rules guard
# These files are off-limits to the owner. A change to any of them on main
# fails this workflow, and GitHub emails Evan. Evan edits them on purpose,
# then ignores the failed run. This is detection, not prevention: the owner
# pushes with Evan's own access, so no branch rule can tell them apart.
on:
  push:
    branches: [main]
    paths:
      - HARD-RULES.md
      - .github/workflows/heartbeat.yml
      - .github/workflows/alert.yml
      - .github/workflows/hard-rules-guard.yml
      - scripts/alert.mjs
      - scripts/alert.ts
      - docs/routines/critic-weekly.md
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          echo "::error::A protected file changed on main in ${{ github.sha }} by ${{ github.actor }}. Only Evan edits these."
          git diff --stat HEAD~1 -- HARD-RULES.md .github/workflows/heartbeat.yml .github/workflows/alert.yml .github/workflows/hard-rules-guard.yml scripts/alert.mjs scripts/alert.ts docs/routines/critic-weekly.md
          exit 1
