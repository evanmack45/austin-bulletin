name: Hard rules guard
# HARD-RULES.md is read-only to the owner. A change to it on main fails this
# workflow, and GitHub notifies Evan. Evan edits the file on purpose, then
# closes the failed run.
on:
  push:
    branches: [main]
    paths: [HARD-RULES.md]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          echo "::error::HARD-RULES.md changed on main in ${{ github.sha }} by ${{ github.actor }}. Only Evan edits this file."
          git diff HEAD~1 -- HARD-RULES.md || true
          exit 1
