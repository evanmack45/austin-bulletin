name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build -- --pathprefix="${{ steps.pages.outputs.base_path }}/"
        env:
          # Optional override of the public Kit form. Blank keeps that default.
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
          # Optional. Blank posts Kit's field name, email_address.
          NEWSLETTER_EMAIL_FIELD: ${{ secrets.NEWSLETTER_EMAIL_FIELD }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
