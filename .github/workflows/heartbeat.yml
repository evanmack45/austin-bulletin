name: Heartbeat
# Checks both live sites from outside Claude. A failed run emails Evan.
# Hourly: both sites answer 200. Daily at 14:30 UTC: today's edition is
# live and the tracker was built today.
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      bulletin_url:
        description: Bulletin URL (test override)
        default: https://theaustinbulletin.com/
      tracker_url:
        description: Tracker URL (test override)
        default: https://yallcityhall.org/
      mode:
        description: up (status only) or fresh (status and dates)
        default: fresh
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - name: Both sites answer 200
        env:
          B: ${{ inputs.bulletin_url || 'https://theaustinbulletin.com/' }}
          T: ${{ inputs.tracker_url || 'https://yallcityhall.org/' }}
        run: |
          set -u
          fail=0
          for u in "$B" "$T"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'TheAustinBulletin-heartbeat/1.0' "$u")
            echo "HTTP $code from $u"
            [ "$code" = "200" ] || { echo "::error::$u returned $code"; fail=1; }
          done
          exit $fail
  fresh:
    if: ${{ github.event.schedule == '30 14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fresh') }}
    runs-on: ubuntu-latest
    steps:
      - name: Bulletin homepage carries today's edition
        env:
          URL: ${{ inputs.bulletin_url || 'https://theaustinbulletin.com/' }}
        run: |
          set -euo pipefail
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          code=$(curl -s -o page.html -w '%{http_code}' -A 'TheAustinBulletin-heartbeat/1.0' "$URL")
          echo "HTTP $code from $URL"
          [ "$code" = "200" ] || { echo "::error::Bulletin returned $code"; exit 1; }
          # Every page carries <meta name="edition-date" content="YYYY-MM-DD"> for the
          # newest edition. OPERATOR.md makes keeping that tag a hard contract.
          lead=$(grep -oE 'name="edition-date" content="[0-9-]+"' page.html | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          echo "edition-date on homepage: ${lead:-missing}; today is $today"
          [ -n "$lead" ] || { echo "::error::edition-date meta tag is missing from the homepage"; exit 1; }
          [ "$lead" = "$today" ] && { echo "Today's edition is live"; exit 0; }
          echo "::error::Bulletin homepage edition is $lead, not today ($today)"; exit 1
      - name: Tracker was built today
        if: always()
        env:
          URL: ${{ inputs.tracker_url || 'https://yallcityhall.org/' }}
        run: |
          set -euo pipefail
          code=$(curl -s -o page.html -w '%{http_code}' -A 'TheAustinBulletin-heartbeat/1.0' "$URL")
          echo "HTTP $code from $URL"
          [ "$code" = "200" ] || { echo "::error::Tracker returned $code"; exit 1; }
          stamp=$(TZ=America/Chicago date '+%B %-d, %Y')
          if grep -q "Site built $stamp" page.html; then echo "Tracker footer: Site built $stamp"; exit 0; fi
          echo "::error::Tracker footer does not say 'Site built $stamp'"; grep -o 'Site built [^<]*' page.html | head -1; exit 1
